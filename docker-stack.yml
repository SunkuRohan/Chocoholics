# Deployed with: docker stack deploy -c docker-stack.yml chocoholics
# Needs IMAGE and POSTGRES_PASSWORD in the environment (the Jenkins pipeline sets them).
services:
  app:
    image: ${IMAGE}
    environment:
      DATABASE_URL: postgres://chocoholics:${POSTGRES_PASSWORD}@db:5432/chocoholics
      COOKIE_SECURE: "false"
      SEED_SAMPLE_REVIEWS: "true"
    ports:
      - "3000:3000"
    networks:
      - appnet
    deploy:
      replicas: 3
      placement:
        max_replicas_per_node: 1          # one replica on each of the three nodes
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first                # start the new replica before stopping the old one
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chocoholics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chocoholics
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager          # the database data lives on the manager's disk
      restart_policy:
        condition: on-failure
networks:
  appnet:
    driver: overlay
volumes:
  pgdata:
