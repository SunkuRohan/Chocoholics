<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chocoholics – Chocolate gift hampers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1E2D0;--ink:#2A1812;--rasp:#7B4528;--pist:#C5DDA8;--card:#FBF4EA;--mut:#6b5446;--on-rasp:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1410;--ink:#F1E2D0;--rasp:#D9A57A;--pist:#8FB36B;--card:#2C1F18;--mut:#cdb8a6;--on-rasp:#2A1812}}
:root[data-theme="dark"]{--bg:#1E1410;--ink:#F1E2D0;--rasp:#D9A57A;--pist:#8FB36B;--card:#2C1F18;--mut:#cdb8a6;--on-rasp:#2A1812}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bagel Fat One','DM Sans',system-ui,sans-serif;font-weight:400;margin:0;line-height:1}
a{color:inherit}
:focus-visible{outline:3px solid var(--rasp);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
nav b{font-family:'Bagel Fat One',sans-serif;font-weight:400;font-size:24px;color:var(--rasp)}
.btn{font:700 15px 'DM Sans',sans-serif;border:0;border-radius:999px;padding:12px 22px;background:var(--rasp);color:var(--on-rasp);cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.hero{padding:36px 0 56px}
.hero h1{font-size:clamp(56px,14vw,148px);color:var(--rasp);letter-spacing:-.02em;transform:rotate(-2deg);transform-origin:left;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:rotate(-8deg) scale(.85);opacity:0}}
.hero p{max-width:46ch;font-size:19px;margin:22px 0 26px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.strip{background:var(--pist);color:#2A1210;padding:14px 0;font-weight:700}
.strip .wrap{display:flex;gap:10px 32px;flex-wrap:wrap}
section{padding:56px 0}
h2{font-size:clamp(32px,6vw,52px);margin-bottom:8px}
.sub{color:var(--mut);margin:0 0 28px;max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:var(--card);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px}
.card svg{display:block;width:100%;height:auto;border-radius:14px}
.card h3{font-size:24px}
.card p{margin:0;color:var(--mut);flex:1}
.card .foot{display:flex;justify-content:space-between;align-items:center}
.price{font-weight:700;font-size:20px}
.order{background:var(--card);border-radius:22px;padding:24px;max-width:560px}
.order ul{list-style:none;padding:0;margin:0 0 14px}
.order li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.order li button{background:none;border:0;color:var(--rasp);font-weight:700;cursor:pointer}
.empty{color:var(--mut)}
label{display:block;font-weight:500;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:12px;padding:11px 14px}
input:focus,textarea:focus{border-color:var(--rasp);outline:0}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin:6px 0 4px}
footer{padding:36px 0;color:var(--mut);font-size:14px}
@media(prefers-reduced-motion:reduce){.hero h1{animation:none}}

nav .links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav a.l{text-decoration:none;font-weight:500;padding:8px 12px;border-radius:999px}
nav a.l[aria-current="page"]{background:var(--pist);color:#2A1210}
.card{position:relative;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-6px)}
.card svg{transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.card:hover svg{transform:scale(1.05) rotate(-1.5deg)}
.ch,.bow{transform-box:fill-box;transform-origin:center}
.card:hover .ch{animation:hop .55s calc(var(--i)*55ms) ease both}
.card:hover .bow{animation:wig .7s ease both}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-9px) scale(1.14)}}
@keyframes wig{0%,100%{transform:rotate(0) scale(1)}30%{transform:rotate(-16deg) scale(1.2)}65%{transform:rotate(10deg) scale(1.1)}}
.brand span{display:inline-block}
.brand:hover span{animation:bounce .55s calc(var(--i)*45ms) ease both}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-.28em) rotate(-7deg)}70%{transform:translateY(.04em) rotate(3deg)}}
.card h3 a{text-decoration:none}
.card .stretch::after{content:"";position:absolute;inset:0;border-radius:22px}
.card .stretch:focus-visible{outline:none}
.card:focus-within{outline:3px solid var(--rasp);outline-offset:3px}
.card .btn{position:relative;z-index:1}
.card .qty{position:relative;z-index:1;margin:0}
.qin{width:56px;text-align:center;padding:8px 4px;font-weight:700;-moz-appearance:textfield}
.qin::-webkit-outer-spin-button,.qin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@media(prefers-reduced-motion:reduce){.card,.card svg{transition:none}.card:hover svg,.card:hover{transform:none}.card:hover .ch,.card:hover .bow,.brand:hover span{animation:none}}
.crumb{display:inline-block;margin:6px 0 18px;color:var(--mut)}
.pdp{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;align-items:start}
.pdp h1{font-size:clamp(34px,6vw,56px);margin-bottom:10px}
.pdp ul{padding-left:20px;margin:12px 0 20px}
.qty{display:inline-flex;align-items:center;gap:10px;margin-right:12px}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font:700 18px 'DM Sans';cursor:pointer}
.stars{color:var(--rasp);letter-spacing:2px}
.rev{background:var(--card);border-radius:18px;padding:18px 20px}
.rev p{margin:6px 0}
.rev small{color:var(--mut)}
.stack{display:grid;gap:14px;max-width:720px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:12px;padding:11px 14px}
.order li .qty{margin:0}
.ok{color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cl{font-weight:700;margin-right:4px}
.chip{font:500 14px 'DM Sans',sans-serif;border:0;border-radius:999px;padding:8px 14px;background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--rasp);color:var(--on-rasp)}
.tag{color:var(--mut)}
p.tag{margin:0 0 8px}
#filters{margin-bottom:20px}
.build{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start}
.ing{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rasp)}
.order li{flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(30,18,12,.55)}
.mbox{background:var(--card);color:var(--ink);border-radius:22px;padding:24px;max-width:420px;width:100%;animation:mpop .2s ease}
.mbox h3{font-size:26px;margin-bottom:8px}
.mbox p{margin:0 0 20px;color:var(--mut)}
.mrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@keyframes mpop{from{transform:scale(.94);opacity:0}}
@media(prefers-reduced-motion:reduce){.mbox{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="#/" style="text-decoration:none"><b class="brand">Chocoholics</b></a>
    <div class="links"><a class="l" href="#/" data-r="home">Hampers</a><a class="l" href="#/build" data-r="build">Build your own</a><a class="l" href="#/reviews" data-r="reviews">Reviews</a><a class="l" href="#/login" id="navacct" data-r="account">Log in</a><a class="btn" href="#/cart" id="navcart">Cart (0)</a></div></nav>
</div>
<main id="app"></main>
<footer><div class="wrap">© Chocoholics. Made with love and a lot of cocoa.</div></footer>

<script>
// Set your WhatsApp number (country code + number, digits only) to receive orders.
var WHATSAPP = "910000000000";
var HAMPERS = [
  {id:"classic",name:"Classic Cocoa Box",cat:"Birthday",type:"Chocolate",desc:"Milk, dark and hazelnut chocolates, 12 pieces.",price:799,c:["#5a2a1c","#8a4a2f","#c68a5c"],items:["6 milk chocolates","3 dark chocolates","3 hazelnut pralines","Handwritten card"]},
  {id:"choconut",name:"Choco-Nut Party Box",cat:"Birthday",type:"Mixed",desc:"Chocolate-coated almonds, hazelnut truffles and roasted peanuts.",price:1099,c:["#6b3a24","#c98a4b","#e8d3a2"],items:["150 g chocolate-coated almonds","6 hazelnut truffles","150 g roasted peanuts","Handwritten card"]},
  {id:"dark",name:"Dark Side Hamper",cat:"Anniversary",type:"Chocolate",desc:"70% and 85% bars, cocoa nibs and a dark truffle set.",price:1299,c:["#2a1210","#4a2420","#7a3b30"],items:["One 70% bar and one 85% bar","Cocoa nibs pouch","6 dark truffles","Handwritten card"]},
  {id:"kaju",name:"Kaju Celebration Box",cat:"Anniversary",type:"Nuts",desc:"Plain, pepper-roasted and chocolate-coated cashews.",price:1499,c:["#a8793f","#e8d3a2","#5a2a1c"],items:["200 g plain cashews (kaju)","150 g pepper-roasted cashews","150 g chocolate-coated cashews","Handwritten card"]},
  {id:"annivmix",name:"Dark Chocolate and Dry Fruit Box",cat:"Anniversary",type:"Mixed",desc:"Dark chocolate squares with figs, dates and almonds.",price:1799,c:["#3a2218","#c98a4b","#8a5a3a"],items:["12 dark chocolate squares","150 g figs (anjeer)","150 g dates (khajoor)","150 g almonds","Handwritten card"]},
  {id:"festive",name:"Festive Mithai Mix",cat:"Festival",type:"Mixed",desc:"Chocolate barks with nuts, dates and saffron, plus truffles.",price:1599,c:["#8a3b1f","#e0a030","#5a2a1c"],items:["Almond and date chocolate bark","Saffron white chocolate bark","8 assorted truffles","Reusable festive box"]},
  {id:"almondpista",name:"Almond and Pista Box",cat:"Festival",type:"Nuts",desc:"Whole almonds, shelled pistachios and cashews in a keepsake box.",price:1399,c:["#6b4a2a","#9bb36b","#e8d3a2"],items:["250 g almonds (badam)","200 g pistachios (pista)","200 g cashews (kaju)","Reusable gift box"]},
  {id:"royal",name:"Royal Dry Fruit Box",cat:"Festival",type:"Dry fruits",desc:"Almonds, cashews, raisins, dates and figs in separate compartments.",price:1899,c:["#7a3b30","#c98a4b","#e0c27a"],items:["200 g almonds","200 g cashews","150 g raisins","150 g dates","150 g figs"]},
  {id:"corp",name:"Office Thank-you Box",cat:"Office",type:"Chocolate",desc:"Individually wrapped squares, ideal for teams. Logo card available.",price:1199,c:["#3a2a20","#c5dda8","#8a4a2f"],items:["24 wrapped chocolate squares","Custom thank-you card","Ships ready to share"]},
  {id:"peanut",name:"Roasted Peanut Crunch Box",cat:"Office",type:"Nuts",desc:"Salted, masala and honey-roasted peanuts for the team.",price:599,c:["#8a5a2b","#d9b26f","#e8d3a2"],items:["200 g salted roasted peanuts","200 g honey-roasted peanuts","150 g masala peanuts"]},
  {id:"snack",name:"Healthy Desk Snack Box",cat:"Office",type:"Dry fruits",desc:"Almonds, walnuts, cranberries and raisins for desk drawers.",price:1299,c:["#6b3a24","#a04a3a","#e0c27a"],items:["200 g almonds","150 g walnuts (akhrot)","150 g dried cranberries","150 g raisins"]},
  {id:"lux",name:"Chocoholic Grand Hamper",cat:"Wedding",type:"Mixed",desc:"Our largest box: truffles, bars, hot chocolate mix and a ribbon-tied keepsake.",price:2999,c:["#7b4528","#2a1210","#c5dda8"],items:["16 truffles","3 signature bars","Hot chocolate mix","Ribbon-tied keepsake box"]},
  {id:"favours",name:"Wedding Favour Set of 10",cat:"Wedding",type:"Mixed",desc:"Ten small boxes, each with two chocolates and a handful of nuts.",price:4499,c:["#8a4a2f","#e0c27a","#c5dda8"],items:["10 small gift boxes","2 chocolates and 30 g mixed nuts in each","Custom name tags on request"]},
  {id:"kids",name:"Sprinkle Party Box",cat:"Kids",type:"Chocolate",desc:"Chocolate lollies, coins, sprinkled bites and a mini mug.",price:999,c:["#c0743a","#7cb6e8","#f2c94c"],items:["4 chocolate lollies","10 chocolate coins","Sprinkled bites","Mini mug"]}
];
var CATS=["All","Birthday","Anniversary","Festival","Office","Wedding","Kids"],TYPES=["All","Chocolate","Nuts","Dry fruits","Mixed"];
var filt={cat:"All",type:"All"};
// Sample ingredient prices per 100 g: replace with your real prices.
var ING=[
  {id:"milk",n:"Milk chocolate",g:"Chocolates",p:180},{id:"darkc",n:"Dark chocolate",g:"Chocolates",p:220},{id:"praline",n:"Hazelnut praline",g:"Chocolates",p:260},{id:"truffle",n:"Truffles",g:"Chocolates",p:320},
  {id:"almond",n:"Almonds (badam)",g:"Nuts",p:120},{id:"kaju",n:"Cashews (kaju)",g:"Nuts",p:160},{id:"pista",n:"Pistachios (pista)",g:"Nuts",p:260},{id:"peanut",n:"Roasted peanuts",g:"Nuts",p:40},{id:"walnut",n:"Walnuts (akhrot)",g:"Nuts",p:150},{id:"hazel",n:"Hazelnuts",g:"Nuts",p:200},
  {id:"raisin",n:"Raisins (kishmish)",g:"Dry fruits",p:60},{id:"dates",n:"Dates (khajoor)",g:"Dry fruits",p:90},{id:"figs",n:"Figs (anjeer)",g:"Dry fruits",p:220},{id:"apricot",n:"Apricots (khumani)",g:"Dry fruits",p:140},{id:"cran",n:"Dried cranberries",g:"Dry fruits",p:130}
];
var BOXES=[{id:"s",n:"Small",g:300,p:150},{id:"m",n:"Medium",g:500,p:250},{id:"l",n:"Large",g:800,p:400}];
var BASES=["Chocolates","Nuts","Dry fruits","Mix of all"];
var bld={base:"Nuts",box:"m",q:{}};
var REVIEWS=[];
var fmt=function(n){return "₹"+n.toLocaleString("en-IN")};
var esc=function(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var byId=function(id){return HAMPERS.filter(function(h){return h.id===id})[0]||customs[id]};
var cart={},customs={};
try{cart=JSON.parse(localStorage.getItem("choco_cart")||"{}")}catch(e){}
try{customs=JSON.parse(localStorage.getItem("choco_customs")||"{}")}catch(e){}
function saveCustoms(){try{localStorage.setItem("choco_customs",JSON.stringify(customs))}catch(e){}}
function saveCart(){try{localStorage.setItem("choco_cart",JSON.stringify(cart))}catch(e){}updateNav()}
function allReviews(){return REVIEWS}
function loadReviews(){return fetch("/api/reviews").then(function(r){return r.json()}).then(function(j){if(Array.isArray(j))REVIEWS=j}).catch(function(){})}
function stars(n){return '<span class="stars" role="img" aria-label="'+n+' out of 5">'+"★".repeat(n)+"☆".repeat(5-n)+'</span>'}
function count(){return Object.keys(cart).reduce(function(s,k){return s+cart[k]},0)}
function ctl(id){var q=cart[id]||0;return q?'<span class="qty"><button data-cd="'+id+'" data-d="-1" aria-label="Remove one">\u2212</button><input class="qin" data-qi="'+id+'" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="'+q+'" aria-label="Quantity in cart"><button data-cd="'+id+'" data-d="1" aria-label="Add one">+</button></span>':'<button class="btn" data-add="'+id+'">Add to cart</button>'}
function refreshCtl(id){var el=document.querySelector('[data-ctl="'+id+'"]');if(!el)return;var inp=el.querySelector("input");if(cart[id]>0&&inp)inp.value=cart[id];else el.innerHTML=ctl(id)}
function updateNav(){document.getElementById("navcart").textContent="Cart ("+count()+")"}

function art(h,k){
  var bg=h.c[2],box=h.c[0],acc=h.c[1],o="";
  for(var r=0;r<2;r++)for(var i=0;i<4;i++){
    var n=r*4+i,x=46+i*40,y=40+r*34,col=(i+r)%2?acc:bg,t=h.type==="Nuts"?3:h.type==="Dry fruits"?((i+r)%2?1:3):(k+i+r)%3;
    o+= t==3?'<ellipse class="ch" style="--i:'+n+'" cx="'+(x+14)+'" cy="'+(y+14)+'" rx="15" ry="11" fill="'+col+'"/>':t==1?'<circle class="ch" style="--i:'+n+'" cx="'+(x+14)+'" cy="'+(y+14)+'" r="14" fill="'+col+'"/>'
       : t==2?'<rect class="ch" style="--i:'+n+'" x="'+x+'" y="'+(y+4)+'" width="32" height="20" rx="4" fill="'+col+'"/>'
       : '<rect class="ch" style="--i:'+n+'" x="'+x+'" y="'+y+'" width="28" height="28" rx="6" fill="'+col+'"/>';
  }
  return '<svg viewBox="0 0 240 144" role="img" aria-label="'+h.name+' illustration"><rect width="240" height="144" fill="'+bg+'" opacity=".35"/>'+
    '<rect x="30" y="22" width="180" height="100" rx="12" fill="'+box+'"/><rect x="38" y="30" width="164" height="84" rx="8" fill="#000" opacity=".3"/>'+o+
    '<g class="bow"><path d="M196 112l-22 22M196 112l22 22" stroke="#D9A441" stroke-width="10" stroke-linecap="round"/><circle cx="196" cy="112" r="9" fill="#D9A441"/></g></svg>';
}
function card(h){
  var k=HAMPERS.indexOf(h);
  return '<article class="card">'+art(h,k)+'<h3><a class="stretch" href="#/product/'+h.id+'">'+h.name+'</a></h3><small class="tag">'+h.cat+' - '+h.type+'</small><p>'+h.desc+'</p>'+
    '<div class="foot"><span class="price">'+fmt(h.price)+'</span><span data-ctl="'+h.id+'">'+ctl(h.id)+'</span></div></article>';
}
function revCard(r){var h=byId(r.h)||{name:"a hamper"};return '<div class="rev">'+stars(r.s)+'<p>'+esc(r.t)+'</p><small>'+esc(r.n)+' on <a href="#/product/'+r.h+'">'+h.name+'</a></small></div>'}

function gridHTML(){var l=HAMPERS.filter(function(h){return(filt.cat==="All"||h.cat===filt.cat)&&(filt.type==="All"||h.type===filt.type)});return l.length?l.map(card).join(""):'<p class="empty">No hampers match these filters. Try another occasion or type.</p>'}
function chipRow(list,key,label){return '<div class="chips" role="group" aria-label="'+label+'"><span class="cl">'+label+'</span>'+list.map(function(c){return '<button class="chip" data-f="'+key+'" data-v="'+c+'" aria-pressed="'+(filt[key]===c)+'">'+c+'</button>'}).join("")+'</div>'}
function filterHTML(){return chipRow(CATS,"cat","Occasion")+chipRow(TYPES,"type","Made with")}
function home(){
  var rv=allReviews().slice(0,3).map(revCard).join("");
  var rvSec=rv?'<section><div class="wrap"><h2>What customers say</h2><p class="sub"></p><div class="grid">'+rv+'</div><p><a class="btn alt" href="#/reviews">All reviews</a></p></div></section>':'';
  return '<div class="wrap"><header class="hero"><h1 class="brand">Chocoholics</h1><p>Hand-packed chocolate gift hampers for birthdays, weddings, Diwali and every “just because.”</p>'+
   '<div class="row"><a class="btn" href="#hampers-list" data-scroll="1">Choose a hamper</a><a class="btn alt" href="#/reviews">Read reviews</a></div></header></div>'+
   '<div class="strip"><div class="wrap"><span>Custom messages on every hamper</span><span>Bulk orders for weddings and offices</span><span>Delivery across India</span></div></div>'+
   '<section id="hampers-list"><div class="wrap"><h2>Our hampers</h2><p class="sub">Every hamper comes in a reusable gift box with a handwritten card.</p><div id="filters">'+filterHTML()+'</div><div class="grid" id="grid">'+gridHTML()+'</div></div></section>'+
   '<section><div class="wrap"><div class="order" style="max-width:none"><h2>Make it your own</h2><p class="sub">Pick chocolates, nuts or dry fruits by weight and fill a box your way.</p><a class="btn" href="#/build">Build your own hamper</a></div></div></section>'+
   rvSec;
}
function product(id){
  var h=byId(id); if(!h||h.custom) return notFound();
  var k=HAMPERS.indexOf(h), rs=allReviews().filter(function(r){return r.h===id});
  var avg=rs.length?Math.round(rs.reduce(function(s,r){return s+r.s},0)/rs.length):0;
  return '<div class="wrap"><a class="crumb" href="#/">← All hampers</a><div class="pdp"><div>'+art(h,k)+'</div><div><h1>'+h.name+'</h1><p class="tag">'+h.cat+' - '+h.type+'</p>'+

function confirmBox(title,text,ok,fn){

  function close(){document.removeEventListener("keydown",key);o.remove();if(prev&&prev.isConnected)prev.focus()}
  function key(e){if(e.key==="Escape"){close();return}if(e.key==="Tab"){var b=o.querySelectorAll("button"),f=b[0],l=b[b.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}}
  o.addEventListener("click",function(e){e.stopPropagation();var v=e.target.getAttribute("data-mc");if(v==="1"){close();fn()}else if(v==="0"||e.target===o)close()});
  document.addEventListener("keydown",key);document.body.appendChild(o);o.querySelector('[data-mc="0"]').focus();
}
